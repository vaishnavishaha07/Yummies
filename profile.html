<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yummies - Profile</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #F4F1DE;
            color: #2F3E46;
        }

        header {
            height: 75px;
            background: #52796F;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 45px;
            color: white;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .back-btn {
            text-decoration: none;
            color: white;
            background: #84A98C;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
        }

        .back-btn:hover {
            background: #6f9678;
        }

        .profile-container {
            max-width: 1100px;
            margin: 45px auto;
            padding: 0 25px;
        }

        .page-title {
            margin-bottom: 30px;
        }

        .page-title h1 {
            font-size: 32px;
            color: #2F3E46;
        }

        .page-title p {
            margin-top: 8px;
            color: #6b7478;
        }

        .profile-grid {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 25px;
            align-items: start;
        }

        .profile-card {
            background: #FFFFFF;
            border-radius: 15px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #84A98C;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 38px;
            margin: 0 auto 18px;
        }

        .profile-card h3 {
            font-size: 20px;
            margin-bottom: 7px;
        }

        .email {
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
            word-break: break-word;
        }

        .sidebar-option {
            width: 100%;
            border: none;
            background: transparent;
            padding: 13px 15px;
            margin-top: 8px;
            border-radius: 8px;
            color: #2F3E46;
            font-size: 15px;
            text-align: left;
            cursor: pointer;
            transition: 0.3s;
        }

        .sidebar-option i {
            width: 25px;
            color: #52796F;
        }

        .sidebar-option:hover,
        .sidebar-option.active {
            background: #F4F1DE;
            color: #52796F;
        }

        .profile-section {
            background: #FFFFFF;
            border-radius: 15px;
            padding: 35px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .profile-section h2 {
            font-size: 25px;
            margin-bottom: 8px;
        }

        .section-subtitle {
            color: #777;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #d4d4d4;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            color: #2F3E46;
            background: white;
        }

        .form-group input:focus {
            border-color: #52796F;
            box-shadow: 0 0 0 2px rgba(82,121,111,0.12);
        }

        .form-group input::placeholder {
            color: #999;
            opacity: 1;
        }

        .save-btn,
        .save-role-btn {
            background: #52796F;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            margin-top: 5px;
        }

        .save-btn:hover,
        .save-role-btn:hover {
            background: #3f6259;
        }

        .role-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 25px;
        }

        .role-card {
            display: block;
            cursor: pointer;
        }

        .role-card input {
            display: none;
        }

        .role-content {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 18px 20px;
            background: #FFFFFF;
            border: 2px solid #e1e1e1;
            border-radius: 12px;
            transition: 0.3s;
        }

        .role-content i {
            font-size: 25px;
            color: #52796F;
            width: 35px;
            text-align: center;
        }

        .role-content h3 {
            margin-bottom: 5px;
            color: #2F3E46;
        }

        .role-content p {
            color: #777;
            font-size: 14px;
        }

        .role-card input:checked + .role-content {
            border-color: #52796F;
            background: #F4F1DE;
        }

        .selected-role {
            margin-top: 20px;
            padding: 12px 15px;
            background: #F4F1DE;
            border-radius: 8px;
            color: #52796F;
            font-weight: 600;
        }

        @media (max-width: 750px) {
            header {
                padding: 0 20px;
            }

            .profile-grid {
                grid-template-columns: 1fr;
            }

            .profile-container {
                margin-top: 25px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">Yummies</div>

    <div class="header-right">
        <a href="index.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Home
        </a>
    </div>
</header>

<main class="profile-container">

    <div class="page-title">
        <h1>My Profile</h1>
        <p>Manage your Yummies profile and role</p>
    </div>

    <div class="profile-grid">

        <section class="profile-card">

            <div class="avatar">
                <i class="fa-regular fa-user"></i>
            </div>

            <h3 id="displayName">Your Name</h3>

            <div class="email" id="displayEmail">
                yourname@example.com
            </div>

            <button class="sidebar-option active" onclick="showSection('editProfile', this)">
                <i class="fa-solid fa-pen"></i>
                Edit Profile
            </button>

            <button class="sidebar-option" onclick="showSection('role', this)">
                <i class="fa-solid fa-user-tag"></i>
                Role
            </button>

        </section>


        <section id="editProfile" class="profile-section">

            <h2>Edit Profile</h2>

            <p class="section-subtitle">
                Update your personal information
            </p>

            <div class="form-group">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    autocomplete="off">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email address"
                    autocomplete="off">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your phone number"
                    autocomplete="off">
            </div>

            <button class="save-btn" onclick="saveProfile()">
                Save Changes
            </button>

        </section>


        <section id="role" class="profile-section" style="display: none;">

            <h2>Select Your Role</h2>

            <p class="section-subtitle">
                Choose your role for Yummies
            </p>

            <div class="role-options">

                <label class="role-card">
                    <input type="radio" name="role" value="Student">

                    <div class="role-content">
                        <i class="fa-solid fa-graduation-cap"></i>

                        <div>
                            <h3>Student</h3>
                            <p>MIT-WPU Student</p>
                        </div>
                    </div>
                </label>


                <label class="role-card">
                    <input type="radio" name="role" value="Faculty">

                    <div class="role-content">
                        <i class="fa-solid fa-chalkboard-user"></i>

                        <div>
                            <h3>Faculties</h3>
                            <p>MIT-WPU Faculty</p>
                        </div>
                    </div>
                </label>


                <label class="role-card">
                    <input type="radio" name="role" value="Encave Staff">

                    <div class="role-content">
                        <i class="fa-solid fa-utensils"></i>

                        <div>
                            <h3>Encave Staff</h3>
                            <p>Encave Café Staff</p>
                        </div>
                    </div>
                </label>

            </div>

            <button class="save-role-btn" onclick="saveRole()">
                Save Role
            </button>

            <div id="selectedRole" class="selected-role" style="display: none;"></div>

        </section>

    </div>

</main>


<script>
    function showSection(sectionId, clickedButton) {
        document.getElementById("editProfile").style.display = "none";
        document.getElementById("role").style.display = "none";

        document.getElementById(sectionId).style.display = "block";

        document.querySelectorAll(".sidebar-option").forEach(button => {
            button.classList.remove("active");
        });

        clickedButton.classList.add("active");
    }


    function saveProfile() {
        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const phone = document.getElementById("phone").value.trim();

        if (name !== "") {
            document.getElementById("displayName").textContent = name;
            localStorage.setItem("yummiesName", name);
        }

        if (email !== "") {
            document.getElementById("displayEmail").textContent = email;
            localStorage.setItem("yummiesEmail", email);
        }

        if (phone !== "") {
            localStorage.setItem("yummiesPhone", phone);
        }

        alert("Profile updated successfully!");
    }


    function saveRole() {
        const selectedRole = document.querySelector('input[name="role"]:checked');

        if (!selectedRole) {
            alert("Please select a role.");
            return;
        }

        localStorage.setItem("yummiesRole", selectedRole.value);

        const selectedRoleBox = document.getElementById("selectedRole");

        selectedRoleBox.textContent = "Selected Role: " + selectedRole.value;
        selectedRoleBox.style.display = "block";

        alert("Role saved successfully!");
    }


    window.addEventListener("DOMContentLoaded", function() {

        const savedName = localStorage.getItem("yummiesName");
        const savedEmail = localStorage.getItem("yummiesEmail");
        const savedRole = localStorage.getItem("yummiesRole");

        if (savedName) {
            document.getElementById("displayName").textContent = savedName;
            document.getElementById("name").value = savedName;
        }

        if (savedEmail) {
            document.getElementById("displayEmail").textContent = savedEmail;
            document.getElementById("email").value = savedEmail;
        }

        if (savedRole) {
            const roleInput = document.querySelector(
                'input[name="role"][value="' + savedRole + '"]'
            );

            if (roleInput) {
                roleInput.checked = true;
            }

            const selectedRoleBox = document.getElementById("selectedRole");

            selectedRoleBox.textContent = "Selected Role: " + savedRole;
            selectedRoleBox.style.display = "block";
        }
    });
</script>

</body>
</html>
